name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Godot Android export (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.7.2
      GODOT_RELEASE: 4.7.2-stable

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK / NDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/28.1.13356709" >> "$GITHUB_ENV"

      - name: Download pinned Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="$RUNNER_TEMP/godot-${GODOT_VERSION}"
          mkdir -p "$GODOT_DIR" "$RUNNER_TEMP/godot-template-archive"
          curl --fail --location --retry 3 \
            "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64" \
            --output "$RUNNER_TEMP/godot-editor.zip"
          unzip -q "$RUNNER_TEMP/godot-editor.zip" -d "$GODOT_DIR"
          GODOT_BIN="$GODOT_DIR/Godot_v${GODOT_RELEASE}_linux.x86_64"
          test -x "$GODOT_BIN" || chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          curl --fail --location --retry 3 \
            "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=export_templates.tpz&platform=templates" \
            --output "$RUNNER_TEMP/godot-templates.tpz"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$RUNNER_TEMP/godot-template-archive"
          TEMPLATE_SOURCE="$(find "$RUNNER_TEMP/godot-template-archive" -type d -name templates -print -quit)"
          test -n "$TEMPLATE_SOURCE"
          TEMPLATE_DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DEST"
          cp -a "$TEMPLATE_SOURCE/." "$TEMPLATE_DEST/"
          test -s "$TEMPLATE_DEST/android_debug.apk"
          test -s "$TEMPLATE_DEST/android_release.apk"
          "$GODOT_BIN" --version

      - name: Prepare CI-only Android debug signing key and Godot paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import project and run playable-loop smoke test
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit --import
          "$GODOT_BIN" --headless --path . --script res://tests/smoke_test.gd

      - name: Export and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          "$GODOT_BIN" --headless --path . --export-debug "Android" "artifacts/VelocityRush3D.apk"
          test -s artifacts/VelocityRush3D.apk
          unzip -t artifacts/VelocityRush3D.apk >/dev/null
          echo "APK ready: $(du -h artifacts/VelocityRush3D.apk | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Rush-3D-Android-APK
          path: artifacts/VelocityRush3D.apk
          if-no-files-found: error
          retention-days: 14
